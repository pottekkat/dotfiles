# herdr config: https://herdr.dev/docs/configuration/
# Keys not listed here keep herdr's built-in default.

[theme]
name = "catppuccin"

# The divider between the sidebar and the panes is drawn in surface_dim
# (ui/sidebar.rs:974), and catppuccin's surface_dim is #1e1e2e, the same color
# as the background, so the line is invisible until navigate mode turns it the
# accent color. surface1 is light enough to see and still dark enough for the
# few places surface_dim is used as a panel background.
[theme.custom]
surface_dim = "#45475a"

# herdr ships with notifications off, so nothing fired until this block existed.
# "herdr" draws the toast inside the TUI, which is what makes prefix+o work:
# that key jumps to the pane the toast came from, and only in-app toasts carry
# a pane target. "system" (macOS Notification Center) and "terminal" (OSC
# escape, the one to use over SSH) send no target, so prefix+o does nothing.
#
# Only two transitions notify: an agent going blocked ("needs attention") and
# an agent finishing work ("finished"). In-app toasts never show for the tab
# you are already on. They dismiss after 8s when blocked, 5s when finished.
#
# delay_seconds is a debounce, not a wait. herdr rechecks the pane when the
# timer expires and drops the notification if the state changed meanwhile, so a
# permission prompt you answer within a second stays quiet.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

# Sound is independent of the toast delivery above and plays even when delivery
# is off. The blocked sound is never suppressed, including on the focused tab;
# the finished sound follows the same active-tab rule as the toast.
# Per agent: [ui.sound.agents] claude = "off". HERDR_DISABLE_SOUND=1 kills both.
[ui.sound]
enabled = true

[keys]
prefix = "ctrl+b"

# tmux split aliases (tmux: % is side by side, " is stacked)
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]

# Pane navigation keeps the prefix form. The prefix-free ctrl+hjkl chords are
# further down as custom commands, because they need a script in front of them.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Workspace movement. Binding a key that a default already owns disables that
# default with no warning, so every action below is one herdr leaves unbound,
# on a key no default claims. prefix+w (picker) and prefix+g (navigator) still work.
switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+{"          # { } for workspaces mirrors [ ] for tabs
next_workspace = "prefix+}"
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+,"
next_agent = "prefix+."
last_pane = "prefix+semicolon"           # not prefix+tab: that is cycle_pane_next

# ctrl+hjkl moves between panes, and between nvim splits, without the prefix.
#
# ctrl+h and ctrl+j survive the terminal here. iTerm2 3.5 and later speak the
# kitty keyboard protocol, herdr pushes the disambiguate flag at startup, and in
# that mode only *unmodified* Enter/Tab/Backspace keep their legacy bytes. With
# ctrl held, iTerm2 sends ctrl+h as CSI 104;5u and ctrl+j as CSI 106;5u, so
# neither collapses into Backspace or Enter. Verified by pushing the same flags
# by hand and reading the bytes back.
#
# These go through a script rather than binding focus_pane_* directly, because a
# direct binding swallows the key before nvim can see it. herdr keybindings are a
# flat action table with no equivalent of tmux's if-shell predicate, so the
# predicate lives in the script: nvim gets the key forwarded, everything else
# moves the focus, and a pane with no neighbor that way gets the key handed back
# (which is what keeps ctrl+l clearing the screen).
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-nav left ctrl+h"
description = "focus pane left (nvim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-nav down ctrl+j"
description = "focus pane down (nvim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-nav up ctrl+k"
description = "focus pane up (nvim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.config/herdr/scripts/herdr-nav right ctrl+l"
description = "focus pane right (nvim-aware)"

# The dim styling in the Agents panel follows the token, not the row: `agent`
# renders dimmed wherever it is placed, so reordering the rows does nothing.
# That makes the name you actually gave an agent ("audit-status") the least
# readable thing in the panel, while both rows of two agents in one workspace
# read "coordinator".
#
# A token entry can be an inline style table instead of a bare string, which is
# the only way to override this. dim = false drops the modifier; fg picks it out
# from the bold workspace above it. Omitted fields keep the contextual style,
# so the row order stays at herdr's default.
# Three legibility tiers, all from the catppuccin mocha palette so nothing is
# off-theme: workspace keeps its contextual bold, tab drops to subtext0, and
# the agent name is blue. `tab` is deliberately the quiet one, since it is the
# least useful of the three, but overlay0 was too close to the background to
# read at all.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#a6adc8", dim = false }],
  [{ token = "agent", fg = "#89b4fa", bold = true, dim = false }],
]

# Root for worktree checkouts created by `herdr worktree create` without --path.
# The template is <directory>/<repo>/<branch-slug>, so branch
# pottekkat/fix-thing in axionhypothesis lands at
# ~/Git/worktrees/axionhypothesis/pottekkat-fix-thing.
#
# The default is ~/.herdr/worktrees, which works but buries checkouts away from
# the clones. Keeping them under ~/Git groups them without interleaving twenty
# worktrees among unrelated repos, which is what hand-made ~/Git/axion-wt-* and
# ~/Git/wt-* directories did.
#
# This is only the default for herdr-created worktrees. A plain
# `git worktree add <path>` still goes wherever you point it.
[worktrees]
directory = "~/Git/worktrees"
